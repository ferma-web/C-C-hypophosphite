name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Версия редактора структур Ketcher (https://github.com/epam/ketcher/releases).
      # "latest" — последняя; можно закрепить конкретный тег, например "v3.4.0".
      KETCHER_VERSION: latest
    steps:
      - uses: actions/checkout@v4

      # Ketcher (≈30 МБ) не храним в репозитории — подкладываем при каждом деплое.
      # Он должен лежать на том же домене, что и сайт, иначе страница не сможет
      # прочитать нарисованную молекулу из iframe.
      - name: Add Ketcher standalone build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tmp=$(mktemp -d)
          if [ "$KETCHER_VERSION" = "latest" ]; then
            gh release download --repo epam/ketcher --pattern '*standalone*.zip' --dir "$tmp"
          else
            gh release download "$KETCHER_VERSION" --repo epam/ketcher --pattern '*standalone*.zip' --dir "$tmp"
          fi
          ls -la "$tmp"
          # распаковываем каждый архив в свою папку (unzip возвращает 1 на безобидные предупреждения)
          for z in "$tmp"/*.zip; do
            d="$tmp/unz/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -o -q "$z" -d "$d" || [ $? -eq 1 ]
          done
          echo "--- index.html candidates:"
          find "$tmp/unz" -name index.html -not -path '*/node_modules/*' | tee "$tmp/cands.txt"
          # берём index.html, рядом с которым лежит папка static (собранное приложение Ketcher)
          idx=""
          while IFS= read -r f; do
            if [ -d "$(dirname "$f")/static" ]; then idx="$f"; break; fi
          done < "$tmp/cands.txt"
          if [ -z "$idx" ]; then idx=$(head -n 1 "$tmp/cands.txt"); fi
          if [ -z "$idx" ]; then echo "Ketcher index.html not found"; exit 1; fi
          echo "using $idx"
          rm -rf ketcher
          mkdir ketcher
          cp -r "$(dirname "$idx")"/. ketcher/
          ls -la ketcher

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
