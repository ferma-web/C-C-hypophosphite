name: Refresh data from OdanLab

# Manual only for now — scripts/refresh_data.py is a scaffold and will fail
# until OdanLab's public API + token scheme is confirmed and
# ODANLAB_API_TOKEN is added as a repo secret. Switch the trigger to a
# schedule (e.g. `schedule: [{cron: "0 6 * * *"}]`) once that's done.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run refresh script
        env:
          ODANLAB_API_TOKEN: ${{ secrets.ODANLAB_API_TOKEN }}
        run: python scripts/refresh_data.py
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/molecules.json assets/structures
          git diff --cached --quiet || git commit -m "Refresh data from OdanLab"
          git push
